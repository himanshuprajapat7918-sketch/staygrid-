        function deepClone(obj) {
          return JSON.parse(JSON.stringify(obj));
        }

        function escapeHtml(str) {
          return String(str ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function formatINR(amount) {
          const safe = Number.isFinite(Number(amount)) ? Number(amount) : 0;
          return new Intl.NumberFormat('en-IN', {
            style: 'currency',
            currency: 'INR',
            maximumFractionDigits: 0,
          }).format(safe);
        }

        function isValidEmail(email) {
          return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());
        }

        function isValidPhone(phone) {
          const digits = String(phone || '').replace(/\D/g, '');
          return digits.length >= 10 && digits.length <= 15;
        }

        function normalizeImageSrc(src) {
          if (!src) return '';
          if (src.startsWith('/src/assets/')) return '.' + src;
          return src;
        }

        function loadProperties() {
          try {
            const raw = localStorage.getItem(STORAGE_KEYS.PROPERTIES);
            if (!raw) {
              localStorage.setItem(STORAGE_KEYS.PROPERTIES, JSON.stringify(INITIAL_PROPERTIES));
              return deepClone(INITIAL_PROPERTIES);
            }
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              return parsed;
            }
            localStorage.setItem(STORAGE_KEYS.PROPERTIES, JSON.stringify(INITIAL_PROPERTIES));
            return deepClone(INITIAL_PROPERTIES);
          } catch {
            return deepClone(INITIAL_PROPERTIES);
          }
        }

        function saveProperties(list) {
          try {
            localStorage.setItem(STORAGE_KEYS.PROPERTIES, JSON.stringify(list));
            return true;
          } catch {
            return false;
          }
        }

        function loadTenantProfile() {
          try {
            const raw = localStorage.getItem(STORAGE_KEYS.TENANT_PROFILE);
            return raw ? JSON.parse(raw) : null;
          } catch {
            return null;
          }
        }

        function saveTenantProfile(profile) {
          try {
            localStorage.setItem(STORAGE_KEYS.TENANT_PROFILE, JSON.stringify(profile));
          } catch {}
        }

        function loadVisitRequests() {
          try {
            const raw = localStorage.getItem(STORAGE_KEYS.VISIT_REQUESTS);
            const parsed = raw ? JSON.parse(raw) : [];
            return Array.isArray(parsed) ? parsed : [];
          } catch {

          }
        }

        function saveVisitRequests(reqs) {

            localStorage.setItem(STORAGE_KEYS.VISIT_REQUESTS, JSON.stringify(reqs));
          } catch {}
        }

        function getPropertyStats(property) {
          let totalRooms = 0;
          let availableRooms = 0;
          let occupiedRooms = 0;
          let minRent = Infinity;

          for (const floor of property.floors || []) {
            for (const room of floor.rooms || []) {
              totalRooms += 1;
              if (room.status === 'available') availableRooms += 1;
              else occupiedRooms += 1;
              if (room.rent > 0 && room.rent < minRent) minRent = room.rent;
            }
          }
          return {
            totalFloors: (property.floors || []).length,
            totalRooms,
            availableRooms,
            occupiedRooms,
            minRent: minRent === Infinity ? 0 : minRent,
            occupancyRate: totalRooms > 0 ? Math.round((occupiedRooms / totalRooms) * 100) : 0,
          };
        }

        function getPropertyCoverImage(property) {
          for (const floor of property.floors || []) {
            for (const room of floor.rooms || []) {
              if (room.images && room.images.length > 0) {

              }
            }
          }
          return '';
        }

        function createDefaultFloorName(index) {
          return index === 0 ? 'Ground Floor' : `Floor ${index}`;

          const num = roomIndex + 1;

          return `${floorIndex}${String(num).padStart(2, '0')}`;

          return {

              {

                  { id: `rm-${ts}-3`, label: 'G-03', rent: 9500, status: 'occupied', utilities: { electricity: false, water: true, gas: true }, images: [], maintenanceNotes: '' },
                  { id: `rm-${ts}-4`, label: 'G-04', rent: 9500, status: 'available', utilities: { electricity: false, water: true, gas: true }, images: [], maintenanceNotes: '' },
                ],

        }

        function readAndOptimizeImage(file) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onerror = () => reject(new Error('Failed to read image'));
            reader.onload = () => {
              const dataUrl = reader.result;
              const img = new Image();
              img.onload = () => {
                const MAX_DIM = 960;
                let { width, height } = img;
                if (width <= MAX_DIM && height <= MAX_DIM && dataUrl.length < 280000) {
                  resolve(dataUrl);
                  return;
                }
                const scale = Math.min(MAX_DIM / width, MAX_DIM / height, 1);
                width = Math.round(width * scale);
                height = Math.round(height * scale);
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                if (!ctx) {
                  resolve(dataUrl);
                  return;
                }
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.78));
              };
              img.onerror = () => resolve(dataUrl);
              img.src = dataUrl;
            };
            reader.readAsDataURL(file);
          });
        }

          if (!cleanSrc) return fallbackHtml;
          return `

          return (

        function renderOrUpdateOccupancyChart() {
          const canvas = document.getElementById('occupancy-doughnut-canvas');
          if (!canvas || typeof window.Chart === 'undefined') return;

          const stats = getPropertyStats(state.landlord.draft);
          const total = stats.availableRooms + stats.occupiedRooms;
          const hasRooms = total > 0;
          const dataValues = hasRooms ? [stats.availableRooms, stats.occupiedRooms] : [1];
          const labels = hasRooms ? ['Available', 'Occupied'] : ['No rooms yet'];
          const bgColors = hasRooms ? ['#10B981', '#F43F5E'] : ['#E2E8F0'];
          const hoverColors = hasRooms ? ['#059669', '#E11D48'] : ['#CBD5E1'];

          const pctEl = document.getElementById('chart-center-pct');
          const availEl = document.getElementById('chart-legend-available');
          const occEl = document.getElementById('chart-legend-occupied');
          if (pctEl) pctEl.textContent = hasRooms ? `${stats.occupancyRate}%` : '—';
          if (availEl) availEl.textContent = String(stats.availableRooms);
          if (occEl) occEl.textContent = String(stats.occupiedRooms);

          if (occupancyChartInstance && occupancyChartInstance.canvas === canvas) {
            occupancyChartInstance.data.labels = labels;
            occupancyChartInstance.data.datasets[0].data = dataValues;
            occupancyChartInstance.data.datasets[0].backgroundColor = bgColors;
            occupancyChartInstance.data.datasets[0].hoverBackgroundColor = hoverColors;
            occupancyChartInstance.update('active');
            return;

          destroyOccupancyChart();

            type: 'doughnut',
            data: {
              labels,
              datasets: [

                  data: dataValues,
                  backgroundColor: bgColors,
                  hoverBackgroundColor: hoverColors,
                  borderWidth: 2,
                  borderColor: '#FFFFFF',
                  hoverOffset: 3,
                },

            options: {
              responsive: true,
              maintainAspectRatio: true,
              cutout: '72%',
              animation: { duration: 300 },
              plugins: {

                tooltip: {

        // =========================================================================
        // 9. VIEW 3: STUDENT / TENANT PORTAL (WITH PREDICTIVE TYPING SEARCH)
        // =========================================================================
        function getPredictiveSuggestions(query, activeLocation) {
          const q = query.trim().toLowerCase();
          if (!q) return [];
          const locNeedle = (activeLocation || '').toLowerCase();
          return [...state.properties]
            .filter((p) => p.name.toLowerCase().includes(q))
            .sort((a, b) => {
              const aStarts = a.name.toLowerCase().startsWith(q) ? 1 : 0;
              const bStarts = b.name.toLowerCase().startsWith(q) ? 1 : 0;
              if (aStarts !== bStarts) return bStarts - aStarts;
              const aInLoc = locNeedle && a.location.toLowerCase().includes(locNeedle) ? 1 : 0;
              const bInLoc = locNeedle && b.location.toLowerCase().includes(locNeedle) ? 1 : 0;
              if (aInLoc !== bInLoc) return bInLoc - aInLoc;
              return a.name.localeCompare(b.name);
            })
            .slice(0, 6);
        }

        function getInlinePrediction(rawQuery, suggestions) {
          if (!rawQuery.trim() || suggestions.length === 0) return '';
          const topName = suggestions[0].name;
          if (topName.toLowerCase().startsWith(rawQuery.toLowerCase())) {
            return rawQuery + topName.slice(rawQuery.length);
          }
          return '';
        }

        function getTenantDisplayedProperties() {
          const activeLocation = (state.tenantProfile?.preferredLocation || state.tenant.formValues.preferredLocation || '').trim();
          const locNeedle = activeLocation.toLowerCase();
          const locMatched = locNeedle
            ? state.properties.filter((p) => p.location.toLowerCase().includes(locNeedle))
            : state.properties;

          const q = state.tenant.hostelQuery.trim().toLowerCase();
          if (!q) return locMatched;

          const inLoc = locMatched.filter((p) => p.name.toLowerCase().includes(q));
          if (inLoc.length > 0) return inLoc;
          return state.properties.filter((p) => p.name.toLowerCase().includes(q));
        }

          const displayed = getTenantDisplayedProperties();
          const q = state.tenant.hostelQuery.trim();

          const headingText = q ? `Search Results for “${escapeHtml(q)}”` : `Hostels &amp; PGs in ${escapeHtml(activeLocation)}`;

                    .map(

                        `<button type="button" data-quick-location="${escapeHtml(loc)}" class="min-h-[38px] rounded-lg border border-slate-300 bg-white px-3.5 py-1.5 text-xs font-semibold text-slate-700 transition-colors hover:border-indigo-400 hover:text-indigo-700">Explore ${escapeHtml(loc)}</button>`

        function updatePredictiveUiOnly() {
          const activeLocation = (state.tenantProfile?.preferredLocation || state.tenant.formValues.preferredLocation || '').trim();
          const suggestions = getPredictiveSuggestions(state.tenant.hostelQuery, activeLocation);
          const inlinePred = getInlinePrediction(state.tenant.hostelQuery, suggestions);

          // Update ghost autocomplete layer
          const ghostEl = document.getElementById('predictive-ghost');
          const tabHint = document.getElementById('predictive-tab-hint');
          const clearBtn = document.getElementById('clear-search-btn');

          if (ghostEl) {
            if (inlinePred && inlinePred !== state.tenant.hostelQuery) {
              ghostEl.innerHTML = `<span class="invisible whitespace-pre">${escapeHtml(state.tenant.hostelQuery)}</span><span class="truncate">${escapeHtml(inlinePred.slice(state.tenant.hostelQuery.length))}</span>`;
            } else {
              ghostEl.innerHTML = '';
            }
          }
          if (tabHint) {
            tabHint.classList.toggle('hidden', !(inlinePred && inlinePred !== state.tenant.hostelQuery));
          }
          if (clearBtn) {
            clearBtn.classList.toggle('hidden', !state.tenant.hostelQuery);
          }

          // Update predictive dropdown
          const dropdown = document.getElementById('hostel-predictions-listbox');
          if (dropdown) {
            if (state.tenant.isDropdownOpen && suggestions.length > 0) {
              dropdown.classList.remove('hidden');
              dropdown.innerHTML = suggestions
                .map((prop, idx) => {
                  const pStats = getPropertyStats(prop);
                  const isHi = idx === state.tenant.highlightedIndex;
                  const inPref = !activeLocation || prop.location.toLowerCase().includes(activeLocation.toLowerCase());
                  return `
                    <li
                      role="option"
                      aria-selected="${isHi ? 'true' : 'false'}"
                      data-select-prediction="${escapeHtml(prop.id)}"
                      data-prediction-idx="${idx}"
                      class="flex cursor-pointer items-center justify-between gap-4 px-4 py-2.5 text-sm transition-colors ${isHi ? 'bg-indigo-50/80' : 'hover:bg-slate-50'}"

                      <div class="min-w-0">
                        <p class="truncate font-medium text-slate-900">${highlightSubstring(prop.name, state.tenant.hostelQuery)}</p>
                        <p class="mt-0.5 truncate text-xs text-slate-500">${escapeHtml(prop.location)}${!inPref ? ' · Different location' : ''}</p>
                      </div>
                      <span class="shrink-0 font-mono text-xs font-medium text-emerald-700 tabular-nums">${pStats.availableRooms} avail.</span>
                    </li>
                  `;
                })
                .join('');
            } else {
              dropdown.classList.add('hidden');
              dropdown.innerHTML = '';
            }
          }

          // Update results container without touching search input focus!
          const resultsSection = document.getElementById('tenant-results-section');
          if (resultsSection) {
            resultsSection.innerHTML = renderTenantResultsHtml();

                            <span class="text-sm font-medium text-slate-800">Water Bill</span>

                            <input type="checkbox" id="util-gas" ${md.utilities.gas ? 'checked' : ''} class="h-4 w-4 rounded border-slate-300 text-indigo-600" />
                            <span class="text-sm font-medium text-slate-800">Gas Bill</span>

                      <div>
                        <div class="flex items-center justify-between gap-2">

                          <button type="button" id="upload-photos-btn" ${md.images.length >= 6 ? 'disabled' : ''} class="min-h-[40px] shrink-0 whitespace-nowrap rounded-lg border border-slate-300 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 disabled:opacity-50">
                            Upload Photos
                          </button>

                        </div>
                        ${thumbsHtml}
                      </div>

                      <div>
                        <label for="room-maintenance-input" class="block text-sm font-medium text-slate-700">Maintenance Details &amp; Room Notes</label>
                        <textarea id="room-maintenance-input" rows="3" placeholder="Include AC servicing dates, housekeeping schedule, Wi-Fi speed, geyser status, or furnishings..."
                          class="mt-1.5 block w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-sm leading-relaxed text-slate-900 placeholder:text-slate-400 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 focus:outline-none">${escapeHtml(md.maintenanceNotes)}</textarea>
                      </div>
                    </div>

                    <div class="flex items-center justify-end gap-3 border-t border-slate-200 bg-slate-50 px-6 py-4">
                      <button type="button" data-close-modal class="min-h-[40px] whitespace-nowrap rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</button>
                      <button type="submit" class="min-h-[40px] whitespace-nowrap rounded-lg bg-indigo-600 px-5 py-2 text-sm font-semibold text-white hover:bg-indigo-700">Save Room</button>
                    </div>
                  </form>
                </div>
              </div>
            `;
            bindRoomEditorModalEvents();
            return;
          }

          // B. Tenant Room Detail Modal
          if (state.role === 'tenant' && state.tenant.selectedRoomCtx) {
            const { propertyId, floorId, roomId } = state.tenant.selectedRoomCtx;
            const property = state.properties.find((p) => p.id === propertyId);
            const floor = property?.floors.find((f) => f.id === floorId);
            const room = floor?.rooms.find((r) => r.id === roomId);

            if (!property || !floor || !room) {
              modalRoot.innerHTML = '';
              return;
            }

            const images = room.images || [];
            const activeIdx = Math.min(state.tenant.activeImageIdx, Math.max(0, images.length - 1));
            const isAvailable = room.status === 'available';
            const hasRequested = state.visitRequests.some(
              (vr) => vr.propertyId === property.id && vr.roomId === room.id
            );
            const showContact = state.tenant.showContactPanel || hasRequested;

            const utilityCards = [
              { label: 'Electricity Bill', included: room.utilities.electricity },
              { label: 'Water Bill', included: room.utilities.water },
              { label: 'Gas Bill', included: room.utilities.gas },
            ]
              .map(
                (u) => `
                <div class="rounded-xl border p-3.5 ${u.included ? 'border-emerald-200 bg-emerald-50/50' : 'border-slate-200 bg-slate-50/70'}">
                  <p class="text-sm font-semibold text-slate-900">${u.label}</p>
                  <p class="mt-0.5 text-xs font-medium ${u.included ? 'text-emerald-700' : 'text-slate-600'}">
                    ${u.included ? 'Included in rent' : 'Billed separately'}
                  </p>
                </div>
              `
              )
              .join('');

            modalRoot.innerHTML = `
              <div id="modal-backdrop" class="animate-modal-backdrop fixed inset-0 z-50 flex items-center justify-center bg-slate-950/55 p-4 backdrop-blur-[2px]" role="dialog" aria-modal="true" aria-labelledby="room-detail-title">
                <div class="animate-modal-panel flex max-h-[92vh] w-full max-w-3xl flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl" onclick="event.stopPropagation()">
                  <div class="flex items-start justify-between gap-4 border-b border-slate-200 px-6 py-4">
                    <div>
                      <p class="text-xs font-medium text-slate-500">${escapeHtml(property.name)} · ${escapeHtml(floor.name)} · ${escapeHtml(property.location)}</p>
                      <div class="mt-1 flex flex-wrap items-center gap-3">
                        <h2 id="room-detail-title" class="font-display text-xl font-bold text-slate-900">Room ${escapeHtml(room.label)}</h2>
                        <span class="inline-flex items-center rounded-md border px-2.5 py-0.5 text-xs font-semibold ${isAvailable ? 'border-emerald-200 bg-emerald-50 text-emerald-800' : 'border-rose-200 bg-rose-50 text-rose-800'}">
                          ${isAvailable ? 'Available' : 'Occupied'}
                        </span>

                    </div>
                    <button type="button" data-close-modal aria-label="Close room details" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-900">
                      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                  </div>

                  <div class="flex-1 space-y-6 overflow-y-auto p-6">
                    <!-- Gallery -->
                    <div>
                      <div class="relative aspect-[16/10] w-full overflow-hidden rounded-xl border border-slate-200 bg-slate-100">
                        ${renderImageMarkup(images[activeIdx] || '', `${property.name} Room ${room.label}`, `No photos uploaded for Room ${room.label}`)}
                        ${
                          images.length > 1
                            ? `
                          <button type="button" id="gallery-prev-btn" aria-label="Previous photo" class="absolute top-1/2 left-3 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full bg-white/90 text-slate-800 shadow-sm hover:bg-white">‹</button>
                          <button type="button" id="gallery-next-btn" aria-label="Next photo" class="absolute top-1/2 right-3 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full bg-white/90 text-slate-800 shadow-sm hover:bg-white">›</button>
                          <div class="pointer-events-none absolute right-3 bottom-3 rounded-md bg-slate-950/75 px-2.5 py-1 font-mono text-xs text-white tabular-nums">${activeIdx + 1} / ${images.length}</div>
                        `
                            : ''
                        }
                      </div>
                      ${
                        images.length > 1
                          ? `<div class="mt-3 flex gap-2.5 overflow-x-auto pb-1">
                              ${images
                                .map(
                                  (src, idx) => `
                                  <button type="button" data-gallery-idx="${idx}" class="h-16 w-20 shrink-0 overflow-hidden rounded-lg border-2 ${idx === activeIdx ? 'border-indigo-600 opacity-100' : 'border-transparent opacity-70 hover:opacity-100'}">
                                    ${renderImageMarkup(src, `Thumbnail ${idx + 1}`, `Photo ${idx + 1}`)}
                                  </button>
                                `

                                .join('')}
                            </div>`

                    </div>

                    <!-- Rent Summary -->
                    <div class="flex flex-col justify-between gap-4 border-y border-slate-200 py-4 sm:flex-row sm:items-center">
                      <div>
                        <p class="text-xs font-medium text-slate-500">Monthly Rent</p>
                        <p class="mt-0.5 font-mono text-2xl font-bold text-slate-900 tabular-nums">
                          ${escapeHtml(formatINR(room.rent))}<span class="ml-1 font-sans text-sm font-normal text-slate-500">/ month</span>
                        </p>
                      </div>
                      <div class="text-sm text-slate-600 sm:text-right">
                        <p class="font-medium text-slate-900">Managed by ${escapeHtml(property.owner.name)}</p>
                        <p class="font-mono text-xs text-slate-500">${escapeHtml(property.owner.phone)}</p>
                      </div>
                    </div>

                    <!-- Utility Inclusions -->
                    <div>
                      <h3 class="font-display text-sm font-semibold text-slate-900">Utility Bill Inclusions</h3>
                      <div class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-3">${utilityCards}</div>
                    </div>

                    <!-- Maintenance Notes -->
                    <div>
                      <h3 class="font-display text-sm font-semibold text-slate-900">Maintenance Details &amp; Notes</h3>
                      <p class="mt-2 rounded-xl border border-slate-200 bg-slate-50/60 p-4 text-sm leading-relaxed text-slate-700">
                        ${escapeHtml(room.maintenanceNotes || 'No additional maintenance notes have been listed for this room yet. Reach out to the landlord for recent inspection details.')}
                      </p>
                    </div>

                    ${
                      showContact
                        ? `
                      <div class="rounded-xl border border-indigo-200 bg-indigo-50/50 p-5">
                        <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-start">
                          <div>
                            <h4 class="font-display text-sm font-bold text-slate-900">Landlord Contact Details</h4>
                            <p class="mt-1 text-sm font-medium text-slate-800">${escapeHtml(property.owner.name)}</p>
                            <div class="mt-2 flex flex-col gap-1.5 text-sm text-slate-700">
                              <div class="flex items-center gap-2">
                                <a href="tel:${escapeHtml(property.owner.phone.replace(/\s+/g, ''))}" class="font-mono hover:text-indigo-700 hover:underline">${escapeHtml(property.owner.phone)}</a>
                                <button type="button" id="copy-owner-phone-btn" class="rounded px-2 py-0.5 text-xs font-medium text-indigo-700 hover:bg-indigo-100">
                                  ${state.tenant.copiedPhone ? 'Copied' : 'Copy'}
                                </button>
                              </div>
                              <a href="mailto:${escapeHtml(property.owner.email)}" class="hover:text-indigo-700 hover:underline">${escapeHtml(property.owner.email)}</a>
                            </div>
                          </div>
                          ${
                            isAvailable
                              ? `<div class="shrink-0">
                                  ${
                                    hasRequested
                                      ? `<div class="inline-flex items-center rounded-lg border border-emerald-200 bg-emerald-50 px-3.5 py-2 text-xs font-semibold text-emerald-800">Visit Request Sent</div>`
                                      : `<button type="button" data-confirm-visit class="min-h-[40px] whitespace-nowrap rounded-lg bg-indigo-600 px-4 py-2 text-xs font-semibold text-white hover:bg-indigo-700">Send Visit Request</button>`
                                  }
                                  ${
                                    state.tenantProfile
                                      ? `<p class="mt-1.5 text-[11px] text-slate-500">Shares ${escapeHtml(state.tenantProfile.fullName)} (${escapeHtml(state.tenantProfile.phone)})</p>`
                                      : ''
                                  }
                                </div>`
                              : ''
                          }
                        </div>
                      </div>
                    `
                        : ''
                    }
                  </div>

                  <div class="flex flex-wrap items-center justify-between gap-3 border-t border-slate-200 bg-slate-50 px-6 py-4">
                    <button type="button" data-close-modal class="min-h-[42px] whitespace-nowrap rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Close</button>
                    ${
                      isAvailable
                        ? hasRequested
                          ? `<span class="text-sm font-semibold text-emerald-700">Visit request sent to ${escapeHtml(property.owner.name)}</span>`
                          : `<div class="flex flex-wrap items-center gap-2.5">
                              ${!showContact ? `<button type="button" id="show-contact-btn" class="min-h-[42px] whitespace-nowrap rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-800 hover:bg-slate-100">Contact Landlord</button>` : ''}
                              <button type="button" data-confirm-visit class="min-h-[42px] whitespace-nowrap rounded-lg bg-indigo-600 px-5 py-2 text-sm font-semibold text-white hover:bg-indigo-700">Request Visit</button>
                            </div>`
                        : `<div class="flex items-center gap-3">
                            <span class="text-xs text-slate-500">This room is currently occupied.</span>
                            ${!showContact ? `<button type="button" id="show-contact-btn" class="min-h-[40px] whitespace-nowrap rounded-lg border border-slate-300 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-100">Contact Landlord</button>` : ''}
                          </div>`
                    }
                  </div>
                </div>
              </div>
            `;
            bindRoomDetailModalEvents(property, room);
            return;
          }

          modalRoot.innerHTML = '';
        }

        // =========================================================================
        // 11. EVENT BINDINGS
        // =========================================================================
        function bindRoomEditorModalEvents() {
          const backdrop = document.getElementById('modal-backdrop');
          if (backdrop) {
            backdrop.addEventListener('click', (e) => {
              if (e.target === backdrop) closeModals();
            });
          }
          document.querySelectorAll('[data-close-modal]').forEach((btn) => {
            btn.addEventListener('click', closeModals);
          });

          const md = state.landlord.modalDraft;
          if (!md) return;

          const labelInput = document.getElementById('room-label-input');
          const rentInput = document.getElementById('room-rent-input');
          const notesInput = document.getElementById('room-maintenance-input');
          const utilElec = document.getElementById('util-electricity');
          const utilWater = document.getElementById('util-water');
          const utilGas = document.getElementById('util-gas');

          labelInput?.addEventListener('input', (e) => { md.label = e.target.value; });
          rentInput?.addEventListener('input', (e) => { md.rent = e.target.value; });
          notesInput?.addEventListener('input', (e) => { md.maintenanceNotes = e.target.value; });
          utilElec?.addEventListener('change', (e) => { md.utilities.electricity = e.target.checked; });
          utilWater?.addEventListener('change', (e) => { md.utilities.water = e.target.checked; });
          utilGas?.addEventListener('change', (e) => { md.utilities.gas = e.target.checked; });

          document.querySelectorAll('[data-modal-status]').forEach((btn) => {
            btn.addEventListener('click', () => {
              md.status = btn.getAttribute('data-modal-status');
              renderModal();
            });
          });

          const fileInput = document.getElementById('room-images-file-input');
          document.getElementById('upload-photos-btn')?.addEventListener('click', () => fileInput?.click());
          document.getElementById('upload-empty-trigger')?.addEventListener('click', () => fileInput?.click());

          fileInput?.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files || []).filter((f) => f.type.startsWith('image/'));
            if (files.length === 0) return;
            const remaining = Math.max(0, 6 - md.images.length);
            const batch = files.slice(0, remaining);
            try {
              const encoded = await Promise.all(batch.map((file) => readAndOptimizeImage(file)));
              md.images.push(...encoded);
              renderModal();
            } catch {
              showToast('Upload failed', 'Could not read the selected image files.', 'error');
            }
          });

          document.querySelectorAll('[data-remove-modal-img]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const idx = Number(btn.getAttribute('data-remove-modal-img'));
              md.images.splice(idx, 1);
              renderModal();
            });
          });

          document.getElementById('room-editor-form')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const errEl = document.getElementById('room-editor-error');
            const trimmedLabel = String(md.label || '').trim();
            const parsedRent = Number(md.rent);
            if (!trimmedLabel) {
              if (errEl) { errEl.textContent = 'Room number or label is required.'; errEl.classList.remove('hidden'); }
              return;
            }
            if (!Number.isFinite(parsedRent) || parsedRent <= 0) {
              if (errEl) { errEl.textContent = 'Please enter a valid monthly rent greater than 0.'; errEl.classList.remove('hidden'); }
              return;
            }

            const { floorId, roomId } = state.landlord.editingRoomRef;
            const floor = state.landlord.draft.floors.find((f) => f.id === floorId);
            if (floor) {
              floor.rooms = floor.rooms.map((rm) =>
                rm.id === roomId
                  ? {
                      ...rm,
                      label: trimmedLabel,
                      rent: Math.round(parsedRent),
                      status: md.status,
                      utilities: { ...md.utilities },
                      images: [...md.images],
                      maintenanceNotes: String(md.maintenanceNotes || '').trim(),
                    }
                  : rm
              );
            }
            state.landlord.isDirty = true;
            state.landlord.editingRoomRef = null;
            state.landlord.modalDraft = null;
            render();
            showToast(
              `Room ${trimmedLabel} updated`,
              'Click "Save Property" to publish changes to the Student / Tenant portal.',
              'info'
            );
          });
        }

        function bindRoomDetailModalEvents(property, room) {
          const backdrop = document.getElementById('modal-backdrop');
          if (backdrop) {
            backdrop.addEventListener('click', (e) => {
              if (e.target === backdrop) closeModals();
            });
          }
          document.querySelectorAll('[data-close-modal]').forEach((btn) => {
            btn.addEventListener('click', closeModals);
          });

          const totalImgs = (room.images || []).length;
          document.getElementById('gallery-prev-btn')?.addEventListener('click', () => {
            state.tenant.activeImageIdx = (state.tenant.activeImageIdx - 1 + totalImgs) % totalImgs;
            renderModal();
          });
          document.getElementById('gallery-next-btn')?.addEventListener('click', () => {
            state.tenant.activeImageIdx = (state.tenant.activeImageIdx + 1) % totalImgs;
            renderModal();
          });
          document.querySelectorAll('[data-gallery-idx]').forEach((btn) => {
            btn.addEventListener('click', () => {
              state.tenant.activeImageIdx = Number(btn.getAttribute('data-gallery-idx'));
              renderModal();
            });
          });

          document.getElementById('show-contact-btn')?.addEventListener('click', () => {
            state.tenant.showContactPanel = true;
            renderModal();
          });

          document.getElementById('copy-owner-phone-btn')?.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(property.owner.phone);
              state.tenant.copiedPhone = true;
              renderModal();
              window.setTimeout(() => {
                state.tenant.copiedPhone = false;
                renderModal();
              }, 1800);
            } catch {}
          });

          document.querySelectorAll('[data-confirm-visit]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const already = state.visitRequests.some(
                (vr) => vr.propertyId === property.id && vr.roomId === room.id
              );
              if (!already) {
                state.visitRequests.unshift({
                  id: `vr-${Date.now()}`,
                  propertyId: property.id,
                  propertyName: property.name,
                  roomId: room.id,
                  roomLabel: room.label,
                  tenantName: state.tenantProfile?.fullName || 'Prospective Tenant',
                  tenantPhone: state.tenantProfile?.phone || '',
                  tenantEmail: state.tenantProfile?.email || '',
                  createdAt: new Date().toISOString(),
                });
                saveVisitRequests(state.visitRequests);
                showToast(
                  'Visit request sent',
                  `${property.owner.name} has been notified about Room ${room.label} at ${property.name}.`,
                  'success'
                );
              }
              state.tenant.showContactPanel = true;
              render();
            });
          });
        }

        function closeModals() {
          state.landlord.editingRoomRef = null;
          state.landlord.modalDraft = null;
          state.tenant.selectedRoomCtx = null;
          state.tenant.showContactPanel = false;
          state.tenant.copiedPhone = false;
          renderModal();
        }

        function bindMainEvents() {
          const main = document.getElementById('main-content');

          // --- LANDING EVENTS ---
          if (state.role === 'landing') {
            main.querySelectorAll('[data-pick-role]').forEach((el) => {
              el.addEventListener('click', (e) => {
                e.stopPropagation();
                setRole(el.getAttribute('data-pick-role'));
              });
              el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                  e.preventDefault();
                  setRole(el.getAttribute('data-pick-role'));
                }
              });
            });
            return;
          }

          // --- LANDLORD EVENTS ---
          if (state.role === 'landlord') {
            const selectProp = (id) => {
              if (id === 'new') {
                state.landlord.selectedPropertyId = 'new';
                state.landlord.draft = createEmptyProperty();
              } else {
                const found = state.properties.find((p) => p.id === id);
                if (!found) return;
                state.landlord.selectedPropertyId = found.id;
                state.landlord.draft = deepClone(found);
              }
              syncRoomCountInputsFromDraft();
              state.landlord.formErrors = {};
              state.landlord.isDirty = false;
              render();
            };

            document.getElementById('property-selector')?.addEventListener('change', (e) => selectProp(e.target.value));
            document.getElementById('new-property-btn')?.addEventListener('click', () => selectProp('new'));

            main.querySelectorAll('[data-landlord-field]').forEach((input) => {
              input.addEventListener('input', (e) => {
                const field = input.getAttribute('data-landlord-field');
                const val = e.target.value;
                if (field === 'owner_name') state.landlord.draft.owner.name = val;
                else if (field === 'owner_phone') state.landlord.draft.owner.phone = val;
                else if (field === 'owner_email') state.landlord.draft.owner.email = val;
                else if (field === 'name') {
                  state.landlord.draft.name = val;
                  const h1 = document.getElementById('landlord-heading-title');
                  if (h1) h1.textContent = val.trim() || 'New Hostel / PG Listing';
                } else if (field === 'location') {
                  state.landlord.draft.location = val;
                  const locSpan = document.getElementById('publish-location-preview');
                  if (locSpan) locSpan.textContent = val.trim() || 'your location';
                }
                delete state.landlord.formErrors[field];
                state.landlord.isDirty = true;
                document.getElementById('unsaved-indicator')?.classList.remove('hidden');
              });
            });

            const addFloor = () => {
              const idx = state.landlord.draft.floors.length;
              const flId = `fl-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
              const rooms = Array.from({ length: 4 }, (_, rIdx) => ({
                id: `rm-${Date.now()}-${rIdx}-${Math.random().toString(36).slice(2, 5)}`,
                label: generateRoomLabel(idx, rIdx),
                rent: 9500,
                status: 'available',
                utilities: { electricity: false, water: true, gas: true },
                images: [],
                maintenanceNotes: '',
              }));
              state.landlord.draft.floors.push({ id: flId, name: createDefaultFloorName(idx), rooms });
              state.landlord.roomCountInputs[flId] = '4';
              state.landlord.isDirty = true;
              render();
            };

            document.getElementById('add-floor-btn')?.addEventListener('click', addFloor);
            document.getElementById('add-first-floor-btn')?.addEventListener('click', addFloor);

            main.querySelectorAll('[data-floor-name-input]').forEach((input) => {
              input.addEventListener('input', (e) => {
                const flId = input.getAttribute('data-floor-name-input');
                const fl = state.landlord.draft.floors.find((f) => f.id === flId);
                if (fl) fl.name = e.target.value;
                state.landlord.isDirty = true;
                document.getElementById('unsaved-indicator')?.classList.remove('hidden');
              });
            });

            main.querySelectorAll('[data-room-count-input]').forEach((input) => {
              input.addEventListener('input', (e) => {
                const flId = input.getAttribute('data-room-count-input');
                state.landlord.roomCountInputs[flId] = e.target.value;
              });
            });

            main.querySelectorAll('[data-generate-rooms]').forEach((btn) => {
              btn.addEventListener('click', () => {
                const [flId, flIdxStr] = btn.getAttribute('data-generate-rooms').split('::');
                const flIdx = Number(flIdxStr);
                const rawCount = Number(state.landlord.roomCountInputs[flId]);
                if (!Number.isInteger(rawCount) || rawCount < 1 || rawCount > 30) {
                  showToast('Enter between 1 and 30 rooms', 'Choose a valid room count before updating the grid.', 'error');
                  return;
                }
                const fl = state.landlord.draft.floors.find((f) => f.id === flId);
                if (!fl) return;
                if (rawCount < fl.rooms.length) {
                  fl.rooms = fl.rooms.slice(0, rawCount);
                } else if (rawCount > fl.rooms.length) {
                  const baseRent = fl.rooms[0]?.rent ?? 9500;
                  for (let i = fl.rooms.length; i < rawCount; i += 1) {
                    fl.rooms.push({
                      id: `rm-${Date.now()}-${i}-${Math.random().toString(36).slice(2, 6)}`,
                      label: generateRoomLabel(flIdx, i),
                      rent: baseRent,
                      status: 'available',
                      utilities: { electricity: false, water: true, gas: true },
                      images: [],
                      maintenanceNotes: '',
                    });
                  }
                }
                state.landlord.isDirty = true;
                render();
              });
            });

            main.querySelectorAll('[data-remove-floor]').forEach((btn) => {
              btn.addEventListener('click', () => {
                const flId = btn.getAttribute('data-remove-floor');
                state.landlord.draft.floors = state.landlord.draft.floors.filter((f) => f.id !== flId);
                state.landlord.isDirty = true;
                render();
              });
            });

            main.querySelectorAll('[data-quick-toggle]').forEach((btn) => {
              btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const [flId, rmId] = btn.getAttribute('data-quick-toggle').split('::');
                const fl = state.landlord.draft.floors.find((f) => f.id === flId);
                const rm = fl?.rooms.find((r) => r.id === rmId);
                if (rm) {
                  rm.status = rm.status === 'available' ? 'occupied' : 'available';
                  state.landlord.isDirty = true;
                  render();
                }
              });
            });

            main.querySelectorAll('[data-open-room-editor]').forEach((card) => {
              const openEditor = () => {
                const [floorId, roomId] = card.getAttribute('data-open-room-editor').split('::');
                const fl = state.landlord.draft.floors.find((f) => f.id === floorId);
                const rm = fl?.rooms.find((r) => r.id === roomId);
                if (!rm) return;
                state.landlord.editingRoomRef = { floorId, roomId };
                state.landlord.modalDraft = deepClone(rm);
                renderModal();
              };
              card.addEventListener('click', openEditor);
              card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                  e.preventDefault();
                  openEditor();
                }
              });
            });

            main.querySelectorAll('[data-save-property-btn]').forEach((btn) => {
              btn.addEventListener('click', () => {
                const d = state.landlord.draft;
                const errors = {};
                if (!d.owner.name.trim()) errors.owner_name = 'Owner name is required.';
                if (!isValidPhone(d.owner.phone)) errors.owner_phone = 'Enter a valid 10-digit phone number.';
                if (!isValidEmail(d.owner.email)) errors.owner_email = 'Enter a valid email address.';
                if (!d.name.trim()) errors.name = 'Hostel or PG name is required.';
                if (!d.location.trim()) errors.location = 'Location is required.';

                if (Object.keys(errors).length > 0) {
                  state.landlord.formErrors = errors;
                  render();
                  showToast('Please complete required details', 'Check highlighted owner and property fields before saving.', 'error');
                  return;
                }

                const stats = getPropertyStats(d);
                if (d.floors.length === 0 || stats.totalRooms === 0) {
                  showToast('Add at least one floor and room', 'Your property needs at least one room in the 2D grid before publishing.', 'error');
                  return;
                }

                const cleanProp = {
                  ...deepClone(d),
                  name: d.name.trim(),
                  location: d.location.trim(),
                  owner: {
                    name: d.owner.name.trim(),
                    phone: d.owner.phone.trim(),
                    email: d.owner.email.trim(),
                  },
                  floors: d.floors.map((fl, i) => ({
                    ...deepClone(fl),
                    name: fl.name.trim() || createDefaultFloorName(i),
                  })),
                  updatedAt: new Date().toISOString(),
                };

                const current = loadProperties();
                const exists = current.some((p) => p.id === cleanProp.id);
                const nextList = exists
                  ? current.map((p) => (p.id === cleanProp.id ? cleanProp : p))
                  : [cleanProp, ...current];

                if (saveProperties(nextList)) {
                  state.properties = nextList;
                  state.landlord.selectedPropertyId = cleanProp.id;
                  state.landlord.draft = deepClone(cleanProp);
                  state.landlord.formErrors = {};
                  state.landlord.isDirty = false;
                  syncRoomCountInputsFromDraft();
                  render();
                  showToast(
                    'Property saved & published',
                    `${cleanProp.name} (${cleanProp.location}) is now live in the Student / Tenant portal.`,
                    'success'
                  );
                } else {
                  showToast('Storage limit reached', 'Try removing a few large photos and save again.', 'error');
                }
              });
            });

            renderOrUpdateOccupancyChart();
            return;
          }

          // --- TENANT EVENTS ---
          if (state.role === 'tenant') {
            if (state.tenant.isEditingProfile) {
              const form = document.getElementById('tenant-onboarding-form');
              form?.querySelectorAll('input[name]').forEach((input) => {
                input.addEventListener('input', (e) => {
                  const key = input.getAttribute('name');
                  state.tenant.formValues[key] = e.target.value;
                  delete state.tenant.formErrors[key];
                });
              });

              main.querySelectorAll('[data-pick-onboarding-loc]').forEach((btn) => {
                btn.addEventListener('click', () => {
                  const loc = btn.getAttribute('data-pick-onboarding-loc');
                  state.tenant.formValues.preferredLocation = loc;
                  delete state.tenant.formErrors.preferredLocation;
                  render();
                });
              });

              document.getElementById('cancel-tenant-edit-btn')?.addEventListener('click', () => {
                state.tenant.isEditingProfile = false;
                render();
              });

              form?.addEventListener('submit', (e) => {
                e.preventDefault();
                const fv = state.tenant.formValues;
                const errors = {};
                if (!fv.fullName.trim()) errors.fullName = 'Full name is required.';
                if (!isValidPhone(fv.phone)) errors.phone = 'Enter a valid 10-digit phone number.';
                if (!isValidEmail(fv.email)) errors.email = 'Enter a valid email address.';
                if (!fv.preferredLocation.trim()) errors.preferredLocation = 'Please enter or select your preferred location.';

                if (Object.keys(errors).length > 0) {
                  state.tenant.formErrors = errors;
                  render();
                  return;
                }

                const nextProfile = {
                  fullName: fv.fullName.trim(),
                  phone: fv.phone.trim(),
                  email: fv.email.trim(),
                  preferredLocation: fv.preferredLocation.trim(),
                };
                state.tenantProfile = nextProfile;
                saveTenantProfile(nextProfile);
                state.tenant.formValues = { ...nextProfile };
                state.tenant.formErrors = {};
                state.tenant.isEditingProfile = false;
                state.tenant.hostelQuery = '';
                state.tenant.expandedPropertyId = null;
                render();
                showToast('Preferences updated', `Showing hostels and PGs in ${nextProfile.preferredLocation}.`, 'info');
              });
              return;
            }

            document.getElementById('edit-tenant-profile-btn')?.addEventListener('click', () => {
              state.tenant.isEditingProfile = true;
              render();
            });

            // Predictive Search Wiring
            const searchInput = document.getElementById('hostel-predictive-search');
            const dropdown = document.getElementById('hostel-predictions-listbox');
            const activeLocation = (state.tenantProfile?.preferredLocation || state.tenant.formValues.preferredLocation || '').trim();

            const selectPredictionById = (propId) => {
              const prop = state.properties.find((p) => p.id === propId);
              if (!prop) return;
              state.tenant.hostelQuery = prop.name;
              state.tenant.isDropdownOpen = false;
              state.tenant.expandedPropertyId = prop.id;
              if (state.tenantProfile && !prop.location.toLowerCase().includes(activeLocation.toLowerCase())) {
                state.tenantProfile = { ...state.tenantProfile, preferredLocation: prop.location };
                state.tenant.formValues.preferredLocation = prop.location;
                saveTenantProfile(state.tenantProfile);
              }
              render();
            };

            searchInput?.addEventListener('focus', () => {
              state.tenant.isDropdownOpen = true;
              updatePredictiveUiOnly();
            });

            searchInput?.addEventListener('input', (e) => {
              state.tenant.hostelQuery = e.target.value;
              state.tenant.isDropdownOpen = true;
              state.tenant.highlightedIndex = 0;
              updatePredictiveUiOnly();
            });

            searchInput?.addEventListener('keydown', (e) => {
              const suggestions = getPredictiveSuggestions(state.tenant.hostelQuery, activeLocation);
              const inlinePred = getInlinePrediction(state.tenant.hostelQuery, suggestions);

              if ((e.key === 'Tab' || e.key === 'ArrowRight') && inlinePred && inlinePred !== state.tenant.hostelQuery) {
                if (searchInput.selectionStart === state.tenant.hostelQuery.length) {
                  e.preventDefault();
                  state.tenant.hostelQuery = inlinePred;
                  searchInput.value = inlinePred;
                  updatePredictiveUiOnly();
                  return;
                }
              }
              if (!state.tenant.isDropdownOpen || suggestions.length === 0) return;

              if (e.key === 'ArrowDown') {
                e.preventDefault();
                state.tenant.highlightedIndex = (state.tenant.highlightedIndex + 1) % suggestions.length;
                updatePredictiveUiOnly();
              } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                state.tenant.highlightedIndex = (state.tenant.highlightedIndex - 1 + suggestions.length) % suggestions.length;
                updatePredictiveUiOnly();
              } else if (e.key === 'Enter') {
                e.preventDefault();
                const chosen = suggestions[state.tenant.highlightedIndex] || suggestions[0];
                if (chosen) selectPredictionById(chosen.id);
              } else if (e.key === 'Escape') {
                state.tenant.isDropdownOpen = false;
                updatePredictiveUiOnly();
              }
            });

            dropdown?.addEventListener('mousedown', (e) => {
              const li = e.target.closest('[data-select-prediction]');
              if (li) {
                e.preventDefault();
                selectPredictionById(li.getAttribute('data-select-prediction'));
              }
            });

            document.getElementById('clear-search-btn')?.addEventListener('click', () => {
              state.tenant.hostelQuery = '';
              state.tenant.isDropdownOpen = false;
              if (searchInput) searchInput.value = '';
              updatePredictiveUiOnly();
              searchInput?.focus();
            });

            // Delegated events inside tenant results section (works seamlessly after live typing!)
            const resultsSection = document.getElementById('tenant-results-section');
            resultsSection?.addEventListener('click', (e) => {
              const clearEmpty = e.target.closest('#empty-clear-search-btn');
              if (clearEmpty) {
                state.tenant.hostelQuery = '';
                if (searchInput) searchInput.value = '';
                updatePredictiveUiOnly();
                return;
              }

              const quickLocBtn = e.target.closest('[data-quick-location]');
              if (quickLocBtn) {
                const loc = quickLocBtn.getAttribute('data-quick-location');
                state.tenant.formValues.preferredLocation = loc;
                state.tenant.hostelQuery = '';
                state.tenant.expandedPropertyId = null;
                if (state.tenantProfile) {
                  state.tenantProfile = { ...state.tenantProfile, preferredLocation: loc };
                  saveTenantProfile(state.tenantProfile);
                }
                render();
                return;
              }

              const toggleBtn = e.target.closest('[data-toggle-property]');
              if (toggleBtn) {
                const propId = toggleBtn.getAttribute('data-toggle-property');
                state.tenant.expandedPropertyId = state.tenant.expandedPropertyId === propId ? null : propId;
                resultsSection.innerHTML = renderTenantResultsHtml();
                return;
              }

              const roomBtn = e.target.closest('[data-open-room-detail]');
              if (roomBtn) {
                const [propertyId, floorId, roomId] = roomBtn.getAttribute('data-open-room-detail').split('::');
                state.tenant.selectedRoomCtx = { propertyId, floorId, roomId };
                state.tenant.activeImageIdx = 0;
                state.tenant.showContactPanel = false;
                state.tenant.copiedPhone = false;
                renderModal();
              }
            });

            updatePredictiveUiOnly();
          }
        }

        // =========================================================================
        // 12. MASTER RENDER & GLOBAL LISTENERS
        // =========================================================================
        function render() {
          updateNavActiveStyles();
          const main = document.getElementById('main-content');
          if (state.role === 'landing') {
            main.innerHTML = renderLanding();
          } else if (state.role === 'landlord') {
            main.innerHTML = renderLandlord();
          } else {
            main.innerHTML = renderTenant();
          }
          bindMainEvents();
          renderModal();
        }

        document.addEventListener('DOMContentLoaded', () => {
          document.getElementById('footer-copy').textContent = `© ${new Date().getFullYear()} StayGrid. Hostel & PG Management Platform.`;

          document.getElementById('nav-brand-btn')?.addEventListener('click', () => setRole('landing'));
          document.querySelectorAll('[data-nav-role]').forEach((btn) => {
            btn.addEventListener('click', () => setRole(btn.getAttribute('data-nav-role')));
          });

          document.getElementById('switch-role-btn')?.addEventListener('click', () => {
            if (state.role === 'landing') {
              document.getElementById('role-selection-grid')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
              setRole('landing');
            }
          });

          document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
              if (state.landlord.editingRoomRef || state.tenant.selectedRoomCtx) {
                closeModals();
              }
            }
          });

          document.addEventListener('mousedown', (e) => {
            const box = document.getElementById('predictive-search-box');
            if (box && !box.contains(e.target) && state.tenant.isDropdownOpen) {
              state.tenant.isDropdownOpen = false;
              updatePredictiveUiOnly();
            }
          });

          window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEYS.PROPERTIES) {
              state.properties = loadProperties();
              render();
            } else if (e.key === STORAGE_KEYS.TENANT_PROFILE) {
              state.tenantProfile = loadTenantProfile();
              render();
            } else if (e.key === STORAGE_KEYS.VISIT_REQUESTS) {
              state.visitRequests = loadVisitRequests();
              render();
            }
          });

          render();
        });
      })();
    </script>
  </body>
</html>
